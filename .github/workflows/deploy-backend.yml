name: Deploy Backend → VPS

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'commandParser.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar arquivos do backend
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            server.js commandParser.js package.json package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/rubinot/app/"

      - name: Rebuild e restart do container
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          C="sudo docker compose -f /opt/rubinot/docker-compose.yml"
          $C build api
          $C up -d api
          sleep 5
          $C ps api
          REMOTE

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/deploy_key

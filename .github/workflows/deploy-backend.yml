name: Deploy Backend → VPS

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/campin/Rubinot
            git fetch origin
            git reset --hard origin/main
            pm2 restart rubinot || pm2 start server.js --name rubinot
            pm2 save

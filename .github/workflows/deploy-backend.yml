name: Deploy Backend → VPS

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'commandParser.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar arquivos do backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'server.js,commandParser.js,package.json,package-lock.json'
          target: /opt/rubinot/app

      - name: Rebuild e restart do container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Caminho explicito: e exatamente o que /etc/sudoers.d/rubinot-deploy autoriza.
            sudo docker compose -f /opt/rubinot/docker-compose.yml build api
            sudo docker compose -f /opt/rubinot/docker-compose.yml up -d api
            sleep 5
            sudo docker compose -f /opt/rubinot/docker-compose.yml ps api

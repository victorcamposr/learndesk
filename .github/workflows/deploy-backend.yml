# DESATIVADO no push — ver "Problemas conhecidos" no CLAUDE.md.
#
# Conexoes SSH dos runners do GitHub para o host bred estabelecem o TCP, trocam
# alguns KB e travam ate o LoginGraceTime de 120s. Nao e chave, permissao nem
# firewall: do IP do desenvolvedor a mesma chave e o mesmo usuario funcionam.
# E o caminho de rede entre a Azure e o provedor do bred.
#
# O deploy do backend e manual (CLAUDE.md > Deploy > Backend). Este workflow fica
# como workflow_dispatch para o dia em que o caminho de rede mudar.

name: Deploy Backend → VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key fixada em secret: sem ssh-keyscan, sem confiar na 1a conexao.
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enviar arquivos do backend
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            server.js commandParser.js package.json package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/rubinot/app/"

      - name: Rebuild e restart do container
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          C="sudo docker compose -f /opt/rubinot/docker-compose.yml"
          $C build api
          $C up -d api
          sleep 5
          $C ps api
          REMOTE

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/deploy_key

name: teste-rubinot
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Rubinot responde para o runner?
        run: |
          echo "IP do runner: $(curl -s --max-time 15 https://api.ipify.org)"
          curl -s -o /tmp/r.json -w "rubinot=%{http_code}\n" --max-time 25 \
            -A "RubinotWatch/1.0 (+painel interno de tutores)" \
            "https://rubinot.com.br/api/characters/search?name=Campin"
          head -c 200 /tmp/r.json; echo
      - name: A API do painel responde para o runner?
        run: |
          curl -s -o /dev/null -w "painel=%{http_code}\n" --max-time 30 \
            "https://backendcampin.duckdns.org:8443/api/auth/device-status" || echo "painel=falhou"
